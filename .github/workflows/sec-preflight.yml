name: SEC Transport Preflight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sec-preflight.yml"

permissions:
  contents: write

concurrency:
  group: qrgf-sec-preflight
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test official SEC endpoints without storing payloads
        run: |
          set -euo pipefail
          mkdir -p data/preflight
          python - <<'PY'
          import json, subprocess, time
          tests=[]
          uas=[
            'QRGFMarketData/1.0 qrgf-market-data-bot@users.noreply.github.com',
            'chelovekodessa-qrgf-market-data qrgf-market-data-bot@users.noreply.github.com',
          ]
          urls=[
            'https://www.sec.gov/files/company_tickers_exchange.json',
            'https://www.sec.gov/files/company_tickers.json',
            'https://data.sec.gov/submissions/CIK0000320193.json',
          ]
          for ua in uas:
            for url in urls:
              cmd=['curl','--silent','--show-error','--location','--output','/dev/null','--write-out','%{http_code} %{size_download} %{time_total}','--connect-timeout','10','--max-time','30','-H',f'User-Agent: {ua}','-H','Accept: application/json','-H','Accept-Encoding: gzip, deflate',url]
              p=subprocess.run(cmd,text=True,capture_output=True)
              tests.append({'url':url,'ua':ua,'returncode':p.returncode,'result':p.stdout.strip(),'stderr':p.stderr.strip()[-300:]})
              time.sleep(0.2)
          out={'schema_version':'1.0.0','tests':tests}
          open('data/preflight/sec.json','w').write(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY
      - name: Commit sanitized result
        run: |
          set -euo pipefail
          git config user.name "qrgf-market-data-bot"
          git config user.email "qrgf-market-data-bot@users.noreply.github.com"
          git add data/preflight/sec.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record SEC transport preflight"
          git pull --rebase origin main
          git push origin HEAD:main
