name: Update QRGF L1 snapshot

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Update QRGF L0 snapshot"]
    types: [completed]
  schedule:
    - cron: "35 2 * * 2-6"
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-l1.yml"
      - "scripts/build_l1_snapshot.py"
      - "scripts/build_l1_snapshot_free.py"
      - "scripts/l1-trigger.txt"

permissions:
  contents: write

concurrency:
  group: qrgf-l1-snapshot
  cancel-in-progress: true

jobs:
  update:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build, validate, publish and record diagnostics
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: |
          set -uo pipefail
          rm -rf .work/l1
          mkdir -p .work/l1 data/l1-diagnostics
          set +e
          python scripts/build_l1_snapshot_free.py \
            --l0-manifest data/latest/manifest.json \
            --l0-pages-dir data/latest/pages \
            --output-dir .work/l1 \
            --history-calendar-days 400 \
            --batch-size 200 \
            --producer-file scripts/build_l1_snapshot.py \
            --producer-file scripts/build_l1_snapshot_free.py \
            --producer-file .github/workflows/update-l1.yml \
            > .work/l1.stdout 2> .work/l1.stderr
          rc=$?
          set -e
          publishable=0
          python - "$rc" <<'PY'
          import json, sys
          from pathlib import Path
          rc = int(sys.argv[1])
          out = Path('.work/l1.stdout').read_text(errors='replace')[-4000:]
          err = Path('.work/l1.stderr').read_text(errors='replace')[-4000:]
          def safe_text(value):
              text = str(value or '').replace('\\r', ' ').replace('\\n', ' ').strip()
              return text[:500] if text else 'provider_error'

          trigger = {}
          trigger_path = Path('scripts/l1-trigger.txt')
          if trigger_path.exists():
              try:
                  trigger = json.loads(trigger_path.read_text(encoding='utf-8'))
              except (OSError, ValueError, json.JSONDecodeError):
                  trigger = {}

          status = {
              'schema_version': '1.1.0',
              'request_id': str(trigger.get('request_id') or 'scheduled-or-manual'),
              'root_request_id': str(trigger.get('root_request_id') or trigger.get('request_id') or 'scheduled-or-manual'),
              'attempt': int(trigger.get('attempt') or 1),
              'workflow_run_id': str(__import__('os').environ.get('GITHUB_RUN_ID') or 'unknown'),
              'workflow_run_attempt': str(__import__('os').environ.get('GITHUB_RUN_ATTEMPT') or 'unknown'),
              'completed_at': __import__('datetime').datetime.now(__import__('datetime').timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
              'returncode': rc,
              'stdout_tail': out,
              'stderr_tail': err,
              'publishable': False,
          }
          manifest_path = Path('.work/l1/manifest.json')
          if manifest_path.exists():
              manifest = json.loads(manifest_path.read_text())
              alpaca = manifest.get('alpaca') or {}
              raw_errors = alpaca.get('errors') or []
              samples = []
              seen = set()
              for item in raw_errors:
                  if not isinstance(item, dict):
                      continue
                  sample = {
                      'http_status': item.get('http_status'),
                      'message': safe_text(item.get('message')),
                  }
                  key = (sample['http_status'], sample['message'])
                  if key not in seen and len(samples) < 5:
                      seen.add(key)
                      samples.append(sample)
              publishable = rc == 0 and manifest.get('complete') is True and int(manifest.get('rows') or 0) >= 3000
              status['publishable'] = publishable
              status['manifest_summary'] = {
                  'complete': manifest.get('complete'),
                  'rows': manifest.get('rows'),
                  'source_id': manifest.get('source_id'),
                  'coverage': manifest.get('coverage'),
                  'alpaca_requests': alpaca.get('requests'),
                  'alpaca_errors': len(raw_errors),
                  'alpaca_error_samples': samples,
                  'short_history_extension': alpaca.get('short_history_extension'),
                  'reference_provider': manifest.get('reference_provider'),
              }
          Path('data/l1-diagnostics/latest.json').write_text(json.dumps(status, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          if [ "$rc" -eq 0 ]; then
            set +e
            python - <<'PY'
          import json
          from pathlib import Path
          p=Path('.work/l1/manifest.json')
          if not p.exists(): raise SystemExit(3)
          m=json.loads(p.read_text())
          raise SystemExit(0 if m.get('complete') is True and int(m.get('rows') or 0) >= 3000 else 3)
          PY
            validation_rc=$?
            set -e
            if [ "$validation_rc" -eq 0 ]; then publishable=1; else rc=3; fi
          fi
          if [ "$publishable" -eq 1 ]; then
            rm -rf data/l1-next
            mkdir -p data/l1-next
            cp -a .work/l1/. data/l1-next/
            rm -rf data/l1/latest
            mkdir -p data/l1
            mv data/l1-next data/l1/latest
          fi
          git config user.name "qrgf-market-data-bot"
          git config user.email "qrgf-market-data-bot@users.noreply.github.com"
          git add data/l1-diagnostics/latest.json
          if [ "$publishable" -eq 1 ]; then git add data/l1/latest; fi
          if ! git diff --cached --quiet; then
            git commit -m "Record QRGF L1 build result"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
