name: Update QRGF V4.1 Market Session
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Update QRGF v3 Radar", "Promote QRGF V4.1 State"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "data/v3/**"
      - "data/v4/master-core500/**"
      - "data/v4/campaign/**"
      - "data/v4/campaigns/**"
      - "screening/engine/build_v4_market_view.py"
      - "screening/engine/promote_v4_state.py"
      - "screening/engine/test_build_v41_market_view.py"
      - "screening/config/v4-market-producer-release.json"
      - ".github/workflows/update-v4-market.yml"
permissions:
  contents: write
concurrency:
  group: qrgf-v41-market-session
  cancel-in-progress: true
jobs:
  update:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Authority and pagination self-test
        shell: bash
        run: |
          set -euo pipefail
          python screening/engine/test_build_v41_market_view.py
      - name: Build V4.1 market session or explicit blocked diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python screening/engine/build_v4_market_view.py \
            --repo-root . \
            --release-manifest screening/config/v4-market-producer-release.json
          test -f data/v4/market/v41/latest.json
      - name: Commit and remote-readback V4.1 market artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "qrgf-market-data-bot"
          git config user.email "qrgf-market-data-bot@users.noreply.github.com"
          git add -A -- data/v4/market/v41
          if ! git diff --cached --quiet; then
            git commit -m "Publish QRGF V4.1 market session"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          git fetch origin main
          git cat-file -e origin/main:data/v4/market/v41/latest.json
