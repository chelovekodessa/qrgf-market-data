name: Disable legacy QRGF V4.1 producers

on:
  push:
    branches: [main]
    paths:
      - ".v42-disable/READY"

permissions:
  contents: write

concurrency:
  group: qrgf-v42-disable-v41-producers
  cancel-in-progress: false

jobs:
  disable:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify V4.2 before disabling V4.1 writers
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/promote-v42-state.yml
          test -f .github/workflows/update-v42-market.yml
          test -f .github/workflows/promote-v4-state.yml
          test -f .github/workflows/update-v4-market.yml
          grep -q 'data/v4/registry/proposals' .github/workflows/promote-v42-state.yml
          grep -q 'data/v4/registry/proposals' .github/workflows/promote-v4-state.yml
          QRGF_TEST_RESULTS=/tmp/qrgf-v42-disable-tests.json python screening/qrgf_v42/tests/run_tests.py
          python -m compileall -q screening/qrgf_v42 screening/engine
          test ! -f data/v42/master-core500/latest.json
          grep -q 'MASTER_CORE500_NOT_INITIALIZED' data/v42/market/latest.json

      - name: Remove legacy automatic producers
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/promote-v4-state.yml
          rm -f .github/workflows/update-v4-market.yml
          rm -rf .v42-disable
          rm -f .github/workflows/disable-v41-producers.yml
          git config user.name "qrgf-market-data-bot"
          git config user.email "qrgf-market-data-bot@users.noreply.github.com"
          git add -A -- .github/workflows .v42-disable
          git commit -m "Disable legacy QRGF V4.1 producers"
          git push origin HEAD:main
