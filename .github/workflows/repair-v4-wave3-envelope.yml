name: Repair QRGF v4 wave 3 envelope
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-v4-wave3-envelope.yml"
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact invalid artifact and repair derived hashes only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          old = Path("data/v4/registry/proposals/793ee75981dc34bd275eab6a625a0ec7ca5aa4d494b42092bb44b5fc824ddc7b.json")
          expected_file_sha256 = "a444dbc82f4af0516ccbd2db5d54a0931e36d853c65c4bdccaa5893c38305060"
          expected_new_batch = "bf4cf7dc98e4a257d3b61d073db5151b9c5eee137d3e2468d23609039f461981"
          expected_old_jpm_passport = "31484199559baae736fbc9c9a45465a1452872714329b347c0e9ebc683c33c51"
          expected_new_jpm_passport = "05e9efdbfe2fdb090e0829a6a674073a173ae58afb5a19cc0dee7cabdeb3382f"
          expected_old_jpm_proposal = "03d07d29edd1facbb80f3dce01a1753c9865bc63ab46c8998fe0492421138ee7"
          expected_new_jpm_proposal = "98fc7db62c929dbb50d7fe58540cd6598077877e02f5032ab58a3bd26e6d6353"

          raw = old.read_bytes()
          if hashlib.sha256(raw).hexdigest() != expected_file_sha256:
              raise SystemExit("refusing repair: queued batch bytes changed")
          v = json.loads(raw)
          if [x.get("summary", {}).get("ticker") for x in v.get("items", [])] != ["AAPL", "JPM", "AMD", "UBER"]:
              raise SystemExit("refusing repair: unexpected wave identity")

          def canonical(x):
              return json.dumps(x, ensure_ascii=False, sort_keys=True, separators=(",", ":"), allow_nan=False).encode()
          def sem(x):
              return hashlib.sha256(canonical(x)).hexdigest()

          for item in v["items"]:
              ticker = item["summary"]["ticker"]
              actual_passport = sem(item["passport_payload"])
              actual_proposal = sem({k: z for k, z in item.items() if k != "proposal_sha256"})
              if ticker != "JPM":
                  if item["passport_sha256"] != actual_passport or item["proposal_sha256"] != actual_proposal:
                      raise SystemExit(f"refusing repair: unexpected corruption in {ticker}")
              else:
                  if item["passport_sha256"] != expected_old_jpm_passport or actual_passport != expected_new_jpm_passport:
                      raise SystemExit("refusing repair: JPM Passport mismatch differs from audited defect")
                  if item["proposal_sha256"] != expected_old_jpm_proposal:
                      raise SystemExit("refusing repair: JPM proposal hash differs from audited defect")
                  item["passport_sha256"] = actual_passport
                  item["proposal_sha256"] = sem({k: z for k, z in item.items() if k != "proposal_sha256"})
                  if item["proposal_sha256"] != expected_new_jpm_proposal:
                      raise SystemExit("refusing repair: JPM corrected proposal hash unexpected")

          body = {k: z for k, z in v.items() if k != "batch_sha256"}
          v["batch_sha256"] = sem(body)
          if v["batch_sha256"] != expected_new_batch:
              raise SystemExit("refusing repair: corrected batch hash unexpected")

          new = old.with_name(expected_new_batch + ".json")
          new.write_text(json.dumps(v, ensure_ascii=False, separators=(",", ":"), allow_nan=False), encoding="utf-8")
          old.unlink()
          smoke = old.parent / ".release-hash-smoke"
          if smoke.exists(): smoke.unlink()
          print(f"repaired {new}: {len(v['items'])} scopes")
          PY
      - name: Commit exact repaired proposal journal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "qrgf-market-data-bot"
          git config user.email "qrgf-market-data-bot@users.noreply.github.com"
          git add -A -- data/v4/registry/proposals
          git diff --cached --exit-code && { echo "nothing to repair"; exit 1; } || true
          git commit -m "Repair QRGF v4 wave 3 registry envelope"
          git pull --rebase origin main
          git push origin HEAD:main
