name: Update QRGF mass screen

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Update QRGF L1 snapshot"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-screen.yml"
      - "screening/vendor/**"
      - "screening/config/l1-rules.json"

permissions:
  contents: write

concurrency:
  group: qrgf-mass-screen
  cancel-in-progress: true

jobs:
  update:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Materialize pinned screening code
        run: |
          set -euo pipefail
          rm -rf .work/screen
          mkdir -p .work/screen
          for name in bulk_prefilter.py qrgf_common.py publish_mass_screen_snapshot.py; do
            base64 -d "screening/vendor/${name}.gz.b64" | gzip -dc > ".work/screen/${name}"
          done
          cp screening/config/l1-rules.json .work/screen/l1-rules.json
      - name: Verify L1 source and run exact QRGF global prefilter
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          src = Path('data/l1/latest/l1-snapshot.csv.gz.b64')
          if not src.exists():
              raise SystemExit('missing L1 bundle')
          compressed = base64.b64decode(b''.join(src.read_bytes().split()), validate=True)
          Path('.work/screen/l1.csv').write_bytes(gzip.decompress(compressed))
          PY
          python .work/screen/bulk_prefilter.py \
            .work/screen/l1.csv \
            --output .work/screen/l1-finalists.csv \
            --pending-output .work/screen/l1-pending.csv \
            --summary .work/screen/l1-summary.json
      - name: Publish immutable compact screen snapshot
        run: |
          set -euo pipefail
          python .work/screen/publish_mass_screen_snapshot.py \
            --l0-manifest data/latest/manifest.json \
            --l1-manifest data/l1/latest/manifest.json \
            --finalists .work/screen/l1-finalists.csv \
            --summary .work/screen/l1-summary.json \
            --output-root data/screens \
            --page-size 50 \
            --producer-file .work/screen/bulk_prefilter.py \
            --producer-file .work/screen/qrgf_common.py \
            --producer-file .work/screen/l1-rules.json \
            --producer-file .work/screen/publish_mass_screen_snapshot.py \
            --producer-file .github/workflows/update-screen.yml
      - name: Commit screen snapshot
        run: |
          set -euo pipefail
          git config user.name "qrgf-market-data-bot"
          git config user.email "qrgf-market-data-bot@users.noreply.github.com"
          git add data/screens
          if git diff --cached --quiet; then
            echo "Screen snapshot unchanged"
            exit 0
          fi
          git commit -m "Publish QRGF mass screen snapshot"
          git pull --rebase origin main
          git push origin HEAD:main
