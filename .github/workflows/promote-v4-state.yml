name: Promote QRGF V4.1 State
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/v4/master-core500/proposals/**"
      - "data/v4/campaign/proposals/**"
      - "data/v4/registry/proposals/**"
      - "screening/engine/promote_v4_state.py"
      - "screening/engine/test_promote_v4_state.py"
      - "screening/config/v4-state-producer-release.json"
      - ".github/workflows/promote-v4-state.yml"
permissions:
  contents: write
concurrency:
  group: qrgf-v41-state-single-writer
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Replay, exact-size and phase self-test
        shell: bash
        run: |
          set -euo pipefail
          python screening/engine/test_promote_v4_state.py
      - name: Validate and promote V4.1 state
        shell: bash
        run: |
          set -euo pipefail
          python screening/engine/promote_v4_state.py \
            --repo-root . \
            --release-manifest screening/config/v4-state-producer-release.json \
            --published-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if find data/v4/master-core500/proposals -maxdepth 1 -type f -name '*.json' -print -quit 2>/dev/null | grep -q .; then
            test -f data/v4/master-core500/latest.json
            test -f data/v4/campaign/latest.json
          fi
      - name: Commit V4.1 state without consuming journals
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "qrgf-market-data-bot"
          git config user.email "qrgf-market-data-bot@users.noreply.github.com"
          outputs=(
            data/v4/master-core500/sources
            data/v4/master-core500/masters
            data/v4/master-core500/certificates
            data/v4/master-core500/latest.json
            data/v4/campaigns
            data/v4/campaign/latest.json
            data/v4/migrations
            data/v4/registry/scopes
            data/v4/passports
            data/v4/registry/receipts
          )
          existing=()
          for path in "${outputs[@]}"; do
            if [ -e "$path" ]; then existing+=("$path"); fi
          done
          if [ "${#existing[@]}" -gt 0 ]; then git add -A -- "${existing[@]}"; fi
          if ! git diff --cached --quiet; then
            git commit -m "Promote QRGF V4.1 state"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          git fetch origin main
          if find data/v4/master-core500/proposals -maxdepth 1 -type f -name '*.json' -print -quit 2>/dev/null | grep -q .; then
            git cat-file -e origin/main:data/v4/master-core500/latest.json
            git cat-file -e origin/main:data/v4/campaign/latest.json
          fi
