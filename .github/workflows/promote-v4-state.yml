name: Promote QRGF v4 State
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/v4/bootstrap/proposals/**"
      - "data/v4/registry/proposals/**"
      - "screening/engine/promote_v4_state.py"
      - "screening/config/v4-state-producer-release.json"
      - ".github/workflows/promote-v4-state.yml"
permissions:
  contents: write
concurrency:
  group: qrgf-v4-state-single-writer
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate and promote V4 state
        shell: bash
        run: |
          set -euo pipefail
          python screening/engine/promote_v4_state.py \
            --repo-root . \
            --release-manifest screening/config/v4-state-producer-release.json \
            --published-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - name: Commit promoted V4 state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "qrgf-market-data-bot"
          git config user.email "qrgf-market-data-bot@users.noreply.github.com"
          git add -A -- data/v4/bootstrap/cohorts data/v4/bootstrap/latest.json data/v4/bootstrap/progress data/v4/registry/scopes data/v4/passports data/v4/registry/receipts 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Promote QRGF v4 state"
          git pull --rebase origin main
          git push origin HEAD:main
