name: Apply QRGF producer contract patch

on:
  push:
    branches: ["agent/qrgf-producer-contract"]
    paths:
      - ".github/workflows/apply-producer-contract.yml"
      - "scripts/apply_producer_contract_patch.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/qrgf-producer-contract
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply and test patch
        run: python scripts/apply_producer_contract_patch.py
      - name: Commit patched producer files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "qrgf-market-data-bot"
          git config user.email "qrgf-market-data-bot@users.noreply.github.com"
          git add \
            screening/engine/classify_l2.py \
            screening/engine/publish_funnel_snapshot.py \
            screening/config/producer-release.json \
            screening/tests/test_producer_contract.py
          git diff --cached --check
          git commit -m "Fix QRGF producer contract"
          git push origin HEAD:agent/qrgf-producer-contract
