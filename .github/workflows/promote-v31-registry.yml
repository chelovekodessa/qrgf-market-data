name: Promote QRGF v3.1 Registry
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/v31/registry/proposals/**"
      - "screening/engine/promote_v31_registry.py"
      - "screening/config/v31-registry-producer-release.json"
      - ".github/workflows/promote-v31-registry.yml"
permissions:
  contents: write
concurrency:
  group: qrgf-v31-registry-single-writer
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate proposals and publish research-scope entries
        run: |
          set -euo pipefail
          python screening/engine/promote_v31_registry.py --repo-root . --proposals-dir data/v31/registry/proposals --release-manifest screening/config/v31-registry-producer-release.json
      - name: Commit Registry updates
        run: |
          set -euo pipefail
          git config user.name "qrgf-market-data-bot"
          git config user.email "qrgf-market-data-bot@users.noreply.github.com"
          git add -A -- data/v31/registry/scopes data/v31/passports 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Promote QRGF v3.1 Registry entries"
          git pull --rebase origin main
          git push origin HEAD:main
