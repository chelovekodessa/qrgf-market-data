name: QRGF v3.2 Structural Shadow

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "screening/engine/build_v32_structural_shadow.py"
      - "screening/engine/verify_v32_structural_shadow.py"
      - "screening/engine/v32_quality_math.py"
      - "screening/config/v32-quality-bound-model.json"
      - "screening/config/v32-shadow-producer-release.json"
      - ".github/workflows/update-v32-shadow.yml"

permissions:
  contents: write

concurrency:
  group: qrgf-v32-structural-shadow
  cancel-in-progress: true

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || 'main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: SEC connectivity preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .work/v32
          python - <<'PY'
          import json, urllib.error, urllib.request
          urls={
            'ticker_map':'https://www.sec.gov/files/company_tickers_exchange.json',
            'submissions':'https://data.sec.gov/submissions/CIK0000320193.json',
            'companyfacts':'https://data.sec.gov/api/xbrl/companyfacts/CIK0000320193.json',
            'companyfacts_bulk':'https://www.sec.gov/Archives/edgar/daily-index/xbrl/companyfacts.zip',
          }
          headers={'User-Agent':'QRGF-research qrgf-market-data-bot@users.noreply.github.com','Accept':'application/json,*/*','Accept-Encoding':'identity'}
          out={}
          for name,url in urls.items():
              req=urllib.request.Request(url,headers=headers,method='GET')
              try:
                  with urllib.request.urlopen(req,timeout=30) as response:
                      sample=response.read(256)
                      out[name]={'ok':True,'status':int(response.status),'content_type':response.headers.get('content-type'),'sample_bytes':len(sample)}
              except urllib.error.HTTPError as exc:
                  out[name]={'ok':False,'status':int(exc.code),'error':'HTTPError'}
              except Exception as exc:
                  out[name]={'ok':False,'error':type(exc).__name__}
          print(json.dumps(out,indent=2,sort_keys=True))
          open('.work/v32/sec-connectivity.json','w').write(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
      - name: Create exact runtime shadow producer release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .work/v32
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          def fsha(path): return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          def sem(value): return hashlib.sha256(json.dumps(value,ensure_ascii=False,sort_keys=True,separators=(',',':'),allow_nan=False).encode()).hexdigest()
          model=json.loads(Path('screening/config/v32-quality-bound-model.json').read_text())
          body={
            'schema_version':'1.0.0','release_version':'1.0.0','kind':'qrgf_v32_shadow_runtime_release',
            'shadow_only':True,'production_selection_authorized':False,'quality_policy_version':'3.0.0-structural-v1',
            'quality_bound_model_sha256':sem(model),
            'source_v31_frontier_producer_release_sha256':'55ca263d6ec20318ff6436f64eade4d47a5ca9b00ede378a55e855fb58294968',
            'producer_hashes':{
              'build_v32_structural_shadow.py':fsha('screening/engine/build_v32_structural_shadow.py'),
              'verify_v32_structural_shadow.py':fsha('screening/engine/verify_v32_structural_shadow.py'),
              'v32_quality_math.py':fsha('screening/engine/v32_quality_math.py'),
              'v32-quality-bound-model.json':fsha('screening/config/v32-quality-bound-model.json'),
              'update-v32-shadow.yml':fsha('.github/workflows/update-v32-shadow.yml'),
            },
          }
          Path('.work/v32/runtime-release.json').write_text(json.dumps(body,indent=2,sort_keys=True)+'\n')
          PY
      - name: Build SEC Structural Quality shadow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .work/v32
          echo build > .work/v32/stage.txt
          CREATED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          python screening/engine/build_v32_structural_shadow.py \
            --repo-root . \
            --v31-pointer data/v31/latest.json \
            --output-root data/v32-shadow \
            --model screening/config/v32-quality-bound-model.json \
            --release-manifest .work/v32/runtime-release.json \
            --created-at "$CREATED_AT" \
            --page-size 50 > .work/v32/build.json
          cat .work/v32/build.json
      - name: Independently verify shadow before commit
        shell: bash
        run: |
          set -euo pipefail
          echo precommit_verify > .work/v32/stage.txt
          SNAPSHOT_DIR=$(python -c "import json; print(json.load(open('.work/v32/build.json'))['snapshot_dir'])")
          python screening/engine/verify_v32_structural_shadow.py \
            --repo-root . --snapshot-dir "$SNAPSHOT_DIR" --release-manifest .work/v32/runtime-release.json
      - name: Commit immutable shadow snapshot
        shell: bash
        run: |
          set -euo pipefail
          echo snapshot_commit > .work/v32/stage.txt
          SNAPSHOT_DIR=$(python -c "import json; print(json.load(open('.work/v32/build.json'))['snapshot_dir'])")
          git config user.name "qrgf-market-data-bot"
          git config user.email "qrgf-market-data-bot@users.noreply.github.com"
          git add "$SNAPSHOT_DIR"
          if ! git diff --cached --quiet; then
            git commit -m "Publish QRGF v3.2 structural shadow snapshot"
            TARGET_BRANCH="${GITHUB_HEAD_REF:-main}"
            git pull --rebase origin "$TARGET_BRANCH"
            git push origin HEAD:"$TARGET_BRANCH"
          fi
          git rev-parse HEAD > .work/v32/publication-commit.txt
      - name: Verify committed shadow again
        shell: bash
        run: |
          set -euo pipefail
          echo postcommit_verify > .work/v32/stage.txt
          SNAPSHOT_DIR=$(python -c "import json; print(json.load(open('.work/v32/build.json'))['snapshot_dir'])")
          python screening/engine/verify_v32_structural_shadow.py \
            --repo-root . --snapshot-dir "$SNAPSHOT_DIR" --release-manifest .work/v32/runtime-release.json
      - name: Publish compact shadow pointer
        shell: bash
        run: |
          set -euo pipefail
          echo pointer_publish > .work/v32/stage.txt
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          def sem(v): return hashlib.sha256(json.dumps(v,ensure_ascii=False,sort_keys=True,separators=(',',':'),allow_nan=False).encode()).hexdigest()
          build=json.loads(Path('.work/v32/build.json').read_text())
          commit=Path('.work/v32/publication-commit.txt').read_text().strip()
          body={
              'schema_version':'1.0.0','kind':'qrgf_v32_shadow_pointer','shadow_only':True,
              'production_selection_authorized':False,'snapshot_id':build['snapshot_id'],
              'market_session_id':build['market_session_id'],'publication_commit_sha':commit,
              'certificate_path':build['certificate_path'],'certificate_sha256':build['certificate_sha256'],
              'summary_path':build['summary_path'],'summary_sha256':build['summary_sha256'],
          }
          pointer={**body,'pointer_sha256':sem(body)}
          root=Path('data/v32-shadow'); root.mkdir(parents=True,exist_ok=True)
          (root/'latest.json').write_text(json.dumps(pointer,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          PY
          rm -f data/v32-shadow/diagnostics/latest.json
          git add -A -- data/v32-shadow
          if ! git diff --cached --quiet; then
            git commit -m "Point QRGF v3.2 to verified structural shadow"
            TARGET_BRANCH="${GITHUB_HEAD_REF:-main}"
            git pull --rebase origin "$TARGET_BRANCH"
            git push origin HEAD:"$TARGET_BRANCH"
          fi
      - name: Publish fail-closed shadow diagnostic
        if: ${{ failure() }}
        shell: bash
        env:
          QRGF_RUN_ID: ${{ github.run_id }}
          QRGF_RUN_ATTEMPT: ${{ github.run_attempt }}
          QRGF_EVENT_NAME: ${{ github.event_name }}
          QRGF_HEAD_SHA: ${{ github.sha }}
        run: |
          set -u
          git reset --hard HEAD
          mkdir -p data/v32-shadow/diagnostics
          STAGE=$(cat .work/v32/stage.txt 2>/dev/null || printf unknown)
          export QRGF_STAGE="$STAGE"
          python - <<'PY'
          import datetime as dt,json,os
          from pathlib import Path
          payload={
            'schema_version':'1.0.0','kind':'qrgf_v32_shadow_workflow_diagnostic','status':'failure',
            'stage':os.environ.get('QRGF_STAGE','unknown'),'workflow_run_id':os.environ.get('QRGF_RUN_ID'),
            'workflow_run_attempt':os.environ.get('QRGF_RUN_ATTEMPT'),'event_name':os.environ.get('QRGF_EVENT_NAME'),
            'head_sha':os.environ.get('QRGF_HEAD_SHA'),'recorded_at':dt.datetime.now(dt.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),
          }
          Path('data/v32-shadow/diagnostics/latest.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name "qrgf-market-data-bot"
          git config user.email "qrgf-market-data-bot@users.noreply.github.com"
          git add data/v32-shadow/diagnostics/latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record QRGF v3.2 shadow workflow failure"
          TARGET_BRANCH="${GITHUB_HEAD_REF:-main}"
          git pull --rebase origin "$TARGET_BRANCH" || exit 0
          git push origin HEAD:"$TARGET_BRANCH" || true
