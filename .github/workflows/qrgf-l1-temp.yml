name: Temporary QRGF lineage export
# compact-lineage-for-local-state

on:
  push:
    branches: [qrgf-l1-temp-20260808]
    paths:
      - ".github/workflows/qrgf-l1-temp.yml"

permissions:
  contents: write

jobs:
  lineage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qrgf-l1-temp-20260808
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build compact lineage keys
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,json
          from pathlib import Path
          root=Path('data/temp-l1')
          l1=list(csv.DictReader((root/'l1-finalists.csv').open(encoding='utf-8',newline='')))
          l2=json.loads((root/'l2-output.json').read_text(encoding='utf-8'))
          payload={
            'l1_selected': [[r.get('ticker'),r.get('contract_id'),r.get('l1_score')] for r in l1],
            'l2_selected': [[r.get('ticker'),r.get('contract_id')] for r in l2.get('finalists',[])],
          }
          (root/'lineage-sets.json').write_text(json.dumps(payload,separators=(',',':'))+'\n',encoding='utf-8')
          print(len(payload['l1_selected']),len(payload['l2_selected']))
          PY
      - name: Commit compact lineage
        run: |
          set -euo pipefail
          git config user.name "qrgf-l1-temp-bot"
          git config user.email "qrgf-l1-temp-bot@users.noreply.github.com"
          git add data/temp-l1/lineage-sets.json
          git commit -m "Temporary compact L1 L2 lineage sets"
          git push origin HEAD:qrgf-l1-temp-20260808
