name: Temporary QRGF L3 runner

on:
  push:
    branches: [qrgf-l1-temp-20260808]
    paths:
      - ".github/workflows/qrgf-l1-temp.yml"

permissions:
  contents: write

concurrency:
  group: qrgf-l3-temp-20260808
  cancel-in-progress: true

jobs:
  l3:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qrgf-l1-temp-20260808
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect SEC fundamentals and rank L3
        shell: bash
        run: |
          set +e
          mkdir -p data/temp-l1
          LOG=data/temp-l1/l3-diagnostic.log
          : > "$LOG"
          python -m py_compile scripts/qrgf_common.py scripts/qrgf_l3_common.py scripts/evaluate_l3.py scripts/collect_and_rank_l3_sec.py >> "$LOG" 2>&1
          echo "py_compile_exit=$?" >> "$LOG"
          python scripts/collect_and_rank_l3_sec.py data/temp-l1/l2-output.json \
            --out-dir data/temp-l1 \
            --ruleset-version 3.1.0 \
            --ruleset-hash d7dbf15ca011e000eed39e89bf95a056fd8a9231a945c9fe20672290e6e00493 >> "$LOG" 2>&1
          RUN_EXIT=$?
          echo "run_exit=$RUN_EXIT" >> "$LOG"
          git config user.name "qrgf-l3-temp-bot"
          git config user.email "qrgf-l3-temp-bot@users.noreply.github.com"
          git add data/temp-l1/l3-diagnostic.log
          for f in data/temp-l1/l3-input.json data/temp-l1/l3-output.json data/temp-l1/l3-collection.json data/temp-l1/l3-summary.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git commit -m "Temporary SEC-backed L3 research results" || true
          git push origin HEAD:qrgf-l1-temp-20260808 || true
          exit 0
