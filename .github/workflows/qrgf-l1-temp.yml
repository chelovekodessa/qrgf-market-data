name: Temporary QRGF L2 runner
# run-l2-from-complete-l1

on:
  push:
    branches: [qrgf-l1-temp-20260808]
    paths:
      - ".github/workflows/qrgf-l1-temp.yml"

permissions:
  contents: write

concurrency:
  group: qrgf-l1-temp-20260808
  cancel-in-progress: true

jobs:
  l2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qrgf-l1-temp-20260808
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run canonical L2 batch
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/qrgf_common.py scripts/classify_l2.py scripts/batch_l2.py
          python scripts/batch_l2.py data/temp-l1/l1-finalists.csv \
            --rules assets/l2-rules.json \
            --keep 120 \
            --output data/temp-l1/l2-output.json \
            --ruleset-version 3.1.0 \
            --ruleset-hash d7dbf15ca011e000eed39e89bf95a056fd8a9231a945c9fe20672290e6e00493
      - name: Build lineage and summary
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root=Path('data/temp-l1')
          l1=list(csv.DictReader((root/'l1-finalists.csv').open(encoding='utf-8',newline='')))
          l2=json.loads((root/'l2-output.json').read_text(encoding='utf-8'))
          l1_lineage=[{'ticker':r.get('ticker'),'contract_id':r.get('contract_id'),'l1_score':r.get('l1_score'),'l1_status':r.get('l1_status'),'selected_for_next_stage':True} for r in l1]
          l2_lineage=[]
          for r in l2.get('all_results',[]):
              l2_lineage.append({k:r.get(k) for k in ('ticker','contract_id','l2_status','research_priority_score','research_priority_coverage_pct','l2_opportunity_score','l2_risk_score','risk_coverage_pct','preliminary_timing_status','selected_for_next_stage')})
          summary={k:v for k,v in l2.items() if k not in {'all_results','finalists'}}
          summary['finalist_count']=len(l2.get('finalists',[]))
          summary['top20']=[{k:r.get(k) for k in ('ticker','contract_id','l2_status','research_priority_score','research_priority_coverage_pct','l2_risk_score','preliminary_timing_status')} for r in l2.get('finalists',[])[:20]]
          (root/'l1-lineage.json').write_text(json.dumps(l1_lineage,indent=2)+'\n',encoding='utf-8')
          (root/'l2-lineage.json').write_text(json.dumps(l2_lineage,indent=2)+'\n',encoding='utf-8')
          (root/'l2-summary.json').write_text(json.dumps(summary,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(summary,indent=2))
          PY
      - name: Commit L2 results
        run: |
          set -euo pipefail
          git config user.name "qrgf-l1-temp-bot"
          git config user.email "qrgf-l1-temp-bot@users.noreply.github.com"
          git add data/temp-l1/l2-output.json data/temp-l1/l1-lineage.json data/temp-l1/l2-lineage.json data/temp-l1/l2-summary.json
          git commit -m "Temporary L2 global triage results"
          git push origin HEAD:qrgf-l1-temp-20260808
