name: Temporary QRGF linewise lineage export

on:
  push:
    branches: [qrgf-l1-temp-20260808]
    paths:
      - ".github/workflows/qrgf-l1-temp.yml"

permissions:
  contents: write

jobs:
  lineage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qrgf-l1-temp-20260808
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build linewise lineage files
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,json
          from pathlib import Path
          root=Path('data/temp-l1')
          l1=list(csv.DictReader((root/'l1-finalists.csv').open(encoding='utf-8',newline='')))
          l2=json.loads((root/'l2-output.json').read_text(encoding='utf-8'))
          (root/'l1-selected.tsv').write_text(''.join(f"{r.get(\"ticker\")}\t{r.get(\"contract_id\")}\t{r.get(\"l1_score\")}\n" for r in l1),encoding='utf-8')
          (root/'l2-selected.tsv').write_text(''.join(f"{r.get(\"ticker\")}\t{r.get(\"contract_id\")}\n" for r in l2.get('finalists',[])),encoding='utf-8')
          print('l1',len(l1),'l2',len(l2.get('finalists',[])))
          PY
      - name: Commit linewise lineage
        run: |
          set -euo pipefail
          git config user.name "qrgf-l1-temp-bot"
          git config user.email "qrgf-l1-temp-bot@users.noreply.github.com"
          git add data/temp-l1/l1-selected.tsv data/temp-l1/l2-selected.tsv
          git commit -m "Temporary linewise L1 L2 lineage keys"
          git push origin HEAD:qrgf-l1-temp-20260808
