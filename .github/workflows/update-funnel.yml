name: Update QRGF funnel

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Update QRGF L1 snapshot"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "data/l1/latest/**"
      - "screening/engine/**"
      - "screening/vendor/bulk_prefilter.py.gz.b64"
      - "screening/config/**"
      - "screening/assets/**"
      - ".github/workflows/update-funnel.yml"

permissions:
  contents: write

concurrency:
  group: qrgf-funnel
  cancel-in-progress: true

jobs:
  update:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install routing parser dependency
        run: python -m pip install --quiet "pyarrow==17.0.0"
      - name: Materialize pinned bulk prefilter
        shell: bash
        run: |
          set -euo pipefail
          test -f screening/vendor/bulk_prefilter.py.gz.b64
          base64 -d screening/vendor/bulk_prefilter.py.gz.b64 | gzip -dc > screening/engine/bulk_prefilter.py
          python - <<'PY'
          from pathlib import Path
          path = Path("screening/engine/bulk_prefilter.py")
          text = path.read_text(encoding="utf-8")
          old_history = '        if sessions >= L1_SESSIONS_12M:\n            return "full"'
          new_history = ('        # A 252-session return needs 253 observed closes (current close plus\n'
                         '        # the close 252 sessions earlier). The L1 producer follows the same\n'
                         '        # contract and extends histories shorter than 253 observations.\n'
                         '        if sessions > L1_SESSIONS_12M:\n            return "full"')
          old_gate = ('    for row in eligible:\n'
                      '        status = threshold_status(row)\n'
                      '        if status in {"below_price_threshold", "below_liquidity_threshold", "below_market_cap_threshold"}:\n'
                      '            continue\n'
                      '        history = str(row.get("momentum_history_status") or "unknown")\n'
                      '        if status == "pass" and history == "insufficient":\n'
                      '            insufficient.append(row)\n'
                      '            continue')
          new_gate = ('    for row in eligible:\n'
                      '        history = str(row.get("momentum_history_status") or "unknown")\n'
                      '        # Objective insufficient history is already terminal for L1 research\n'
                      '        # eligibility. Later missing price/liquidity fields cannot change that\n'
                      '        # outcome and therefore must not deadlock the full-market coverage gate.\n'
                      '        if history == "insufficient":\n'
                      '            insufficient.append(row)\n'
                      '            continue\n'
                      '        status = threshold_status(row)\n'
                      '        if status in {"below_price_threshold", "below_liquidity_threshold", "below_market_cap_threshold"}:\n'
                      '            continue')
          old_merge = ('    base["quality_seed"] = bool(base.get("quality_seed")) or bool(item.get("quality_seed"))\n'
                       '    base["momentum_history_status"] = normalize_momentum_history_status(\n'
                       '        None,\n'
                       '        base.get("trading_history_days"),\n'
                       '        base.get("return_3m"),\n'
                       '        base.get("return_6m"),\n'
                       '        base.get("return_12m"),\n'
                       '        base.get("listing_date"),\n'
                       '        base.get("as_of"),\n'
                       '    )\n')
          new_merge = ('    base["quality_seed"] = bool(base.get("quality_seed")) or bool(item.get("quality_seed"))\n'
                       '    # An explicit provider source gap must survive merge order and stronger-looking\n'
                       '    # partial updates. Keep the marker private so it cannot leak into exported CSV,\n'
                       '    # but use it when recomputing the canonical history status.\n'
                       '    base["_explicit_history_source_gap"] = bool(base.get("_explicit_history_source_gap")) or (\n'
                       '        str(item.get("momentum_history_status") or "").strip().lower() == "source_gap"\n'
                       '    )\n'
                       '    base["momentum_history_status"] = normalize_momentum_history_status(\n'
                       '        "source_gap" if base["_explicit_history_source_gap"] else None,\n'
                       '        base.get("trading_history_days"),\n'
                       '        base.get("return_3m"),\n'
                       '        base.get("return_6m"),\n'
                       '        base.get("return_12m"),\n'
                       '        base.get("listing_date"),\n'
                       '        base.get("as_of"),\n'
                       '    )\n')
          if old_history not in text or old_gate not in text or old_merge not in text:
              raise SystemExit("pinned bulk_prefilter source no longer matches the expected v3 baseline")
          path.write_text(text.replace(old_history, new_history).replace(old_gate, new_gate).replace(old_merge, new_merge), encoding="utf-8")
          PY
          test "$(sha256sum screening/engine/bulk_prefilter.py | awk '{print $1}')" = "0fa5bc831a1745587530ddcc33dbd3eeee3fa1146760ce82392412e5c019abf3"
      - name: Run producer contract regression tests
        shell: bash
        run: |
          set -euo pipefail
          python screening/tests/test_producer_contract.py
          python screening/tests/test_sec_quality_prior.py
      - name: Capture source identity
        shell: bash
        run: |
          set -euo pipefail
          test -f data/l1/latest/manifest.json
          echo "L1_MANIFEST_SHA256=$(sha256sum data/l1/latest/manifest.json | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "SOURCE_COMMIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Materialize L1 snapshot and ticker routing
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import gzip
          from pathlib import Path
          src = Path("data/l1/latest/l1-snapshot.csv.gz.b64")
          if not src.is_file():
              raise SystemExit("missing L1 bundle")
          compressed = base64.b64decode(b"".join(src.read_bytes().split()), validate=True)
          Path(".work").mkdir(exist_ok=True)
          Path(".work/l1.csv").write_bytes(gzip.decompress(compressed))
          PY
          python screening/engine/materialize_ticker_route.py \
            --output .work/company-tickers.json \
            --meta-output .work/company-tickers-meta.json
      - name: Run exact global L1 ranking
        shell: bash
        run: |
          set -euo pipefail
          python screening/engine/bulk_prefilter.py .work/l1.csv \
            --output .work/l1-finalists.csv \
            --pending-output .work/l1-pending.csv \
            --summary .work/l1-summary.json
      - name: Run setup-only base L2 triage
        shell: bash
        run: |
          set -euo pipefail
          python screening/engine/batch_l2.py .work/l1-finalists.csv \
            --rules screening/assets/l2-rules.json \
            --keep 120 \
            --output .work/l2-base.json
      - name: Enrich mathematically relevant L2 cutoff cohort from SEC
        shell: bash
        run: |
          set -euo pipefail
          python screening/engine/sec_quality_prior.py .work/l1-finalists.csv \
            --base-l2 .work/l2-base.json \
            --rules screening/assets/l2-rules.json \
            --ticker-map-json .work/company-tickers.json \
            --ticker-map-meta .work/company-tickers-meta.json \
            --keep 120 \
            --output .work/l1-quality.csv \
            --summary .work/quality-summary.json
      - name: Run final quality-aware global L2 triage
        shell: bash
        run: |
          set -euo pipefail
          python screening/engine/batch_l2.py .work/l1-quality.csv \
            --rules screening/assets/l2-rules.json \
            --keep 120 \
            --output .work/l2-results.json
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('.work/l2-results.json')
          result = json.loads(path.read_text(encoding='utf-8'))
          result['quality_prior_summary'] = json.loads(Path('.work/quality-summary.json').read_text(encoding='utf-8'))
          path.write_text(json.dumps(result, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
      - name: Refuse stale publication
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          REMOTE_L1_SHA256=$(git show origin/main:data/l1/latest/manifest.json | sha256sum | awk '{print $1}')
          if [ "$REMOTE_L1_SHA256" != "$L1_MANIFEST_SHA256" ]; then
            echo "A newer L1 snapshot exists; this run must not publish an older funnel."
            exit 78
          fi
      - name: Publish immutable funnel snapshot
        shell: bash
        run: |
          set -euo pipefail
          python screening/engine/publish_funnel_snapshot.py \
            --l0-manifest data/latest/manifest.json \
            --l1-manifest data/l1/latest/manifest.json \
            --l1-snapshot .work/l1.csv \
            --l1-finalists .work/l1-finalists.csv \
            --l1-summary .work/l1-summary.json \
            --l2-result .work/l2-results.json \
            --output-root data/funnel \
            --page-size 10 \
            --source-commit-sha "$SOURCE_COMMIT_SHA" \
            --producer-file screening/engine/bulk_prefilter.py \
            --producer-file screening/engine/batch_l2.py \
            --producer-file screening/engine/classify_l2.py \
            --producer-file screening/engine/qrgf_common.py \
            --producer-file screening/engine/materialize_ticker_route.py \
            --producer-file screening/engine/sec_quality_prior.py \
            --producer-file screening/config/l1-rules.json \
            --producer-file screening/assets/l2-rules.json \
            --producer-file screening/engine/publish_funnel_snapshot.py \
            --producer-file .github/workflows/update-funnel.yml \
            --producer-release screening/config/producer-release.json
      - name: Commit funnel atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "qrgf-market-data-bot"
          git config user.email "qrgf-market-data-bot@users.noreply.github.com"
          git add data/funnel
          if git diff --cached --quiet; then
            echo "Snapshot unchanged"
            exit 0
          fi
          git commit -m "Publish QRGF L0-L2 funnel snapshot"
          git fetch origin main
          REMOTE_L1_SHA256=$(git show origin/main:data/l1/latest/manifest.json | sha256sum | awk '{print $1}')
          if [ "$REMOTE_L1_SHA256" != "$L1_MANIFEST_SHA256" ]; then
            echo "A newer L1 snapshot appeared before publication; refusing stale funnel."
            exit 78
          fi
          git rebase origin/main
          git push origin HEAD:main
