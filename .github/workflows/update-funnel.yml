name: Update QRGF funnel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/l1/latest/**"
      - "screening/engine/**"
      - "screening/vendor/bulk_prefilter.py.gz.b64"
      - "screening/config/**"
      - "screening/assets/**"
      - ".github/workflows/update-funnel.yml"

permissions:
  contents: write

concurrency:
  group: qrgf-funnel
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Materialize pinned bulk prefilter
        shell: bash
        run: |
          set -euo pipefail
          test -f screening/vendor/bulk_prefilter.py.gz.b64
          base64 -d screening/vendor/bulk_prefilter.py.gz.b64 | gzip -dc > screening/engine/bulk_prefilter.py
          test "$(sha256sum screening/engine/bulk_prefilter.py | awk '{print $1}')" = "88dc2c61be023a0433c7526f1b768ed305c9ffeacd902643eee00d6a2bda18e2"
      - name: Capture source identity
        shell: bash
        run: |
          set -euo pipefail
          test -f data/l1/latest/manifest.json
          echo "L1_MANIFEST_SHA256=$(sha256sum data/l1/latest/manifest.json | awk '{print $1}')" >> "$GITHUB_ENV"
      - name: Materialize L1 snapshot
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import gzip
          from pathlib import Path
          src = Path("data/l1/latest/l1-snapshot.csv.gz.b64")
          if not src.is_file():
              raise SystemExit("missing L1 bundle")
          compressed = base64.b64decode(b"".join(src.read_bytes().split()), validate=True)
          Path(".work").mkdir(exist_ok=True)
          Path(".work/l1.csv").write_bytes(gzip.decompress(compressed))
          PY
      - name: Run exact global L1 ranking
        shell: bash
        run: |
          set -euo pipefail
          python screening/engine/bulk_prefilter.py .work/l1.csv \
            --output .work/l1-finalists.csv \
            --pending-output .work/l1-pending.csv \
            --summary .work/l1-summary.json
      - name: Run exact global L2 triage
        shell: bash
        run: |
          set -euo pipefail
          python screening/engine/batch_l2.py .work/l1-finalists.csv \
            --rules screening/assets/l2-rules.json \
            --keep 120 \
            --output .work/l2-results.json
      - name: Refuse stale publication
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          REMOTE_L1_SHA256=$(git show origin/main:data/l1/latest/manifest.json | sha256sum | awk '{print $1}')
          if [ "$REMOTE_L1_SHA256" != "$L1_MANIFEST_SHA256" ]; then
            echo "A newer L1 snapshot exists; this run must not publish an older funnel."
            exit 78
          fi
      - name: Publish immutable funnel snapshot
        shell: bash
        run: |
          set -euo pipefail
          python screening/engine/publish_funnel_snapshot.py \
            --l0-manifest data/latest/manifest.json \
            --l1-manifest data/l1/latest/manifest.json \
            --l1-finalists .work/l1-finalists.csv \
            --l1-summary .work/l1-summary.json \
            --l2-result .work/l2-results.json \
            --output-root data/funnel \
            --page-size 50 \
            --source-commit-sha "$GITHUB_SHA" \
            --producer-file screening/engine/bulk_prefilter.py \
            --producer-file screening/engine/batch_l2.py \
            --producer-file screening/engine/classify_l2.py \
            --producer-file screening/engine/qrgf_common.py \
            --producer-file screening/config/l1-rules.json \
            --producer-file screening/assets/l2-rules.json \
            --producer-file screening/engine/publish_funnel_snapshot.py \
            --producer-file .github/workflows/update-funnel.yml
      - name: Commit funnel atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "qrgf-market-data-bot"
          git config user.email "qrgf-market-data-bot@users.noreply.github.com"
          git add data/funnel
          if git diff --cached --quiet; then
            echo "Funnel snapshot unchanged"
            exit 0
          fi
          git commit -m "Publish QRGF L0-L2 funnel snapshot"
          git fetch origin main
          REMOTE_L1_SHA256=$(git show origin/main:data/l1/latest/manifest.json | sha256sum | awk '{print $1}')
          if [ "$REMOTE_L1_SHA256" != "$L1_MANIFEST_SHA256" ]; then
            echo "A newer L1 snapshot appeared before publication; refusing stale funnel."
            exit 78
          fi
          git rebase origin/main
          git push origin HEAD:main
      - name: Publish failure diagnostic
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "source_sha=$GITHUB_SHA"
            echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if [ -f .work/l1-summary.json ]; then
              echo "l1_summary=present"
              cat .work/l1-summary.json
            else
              echo "l1_summary=missing"
            fi
            if [ -f .work/l2-results.json ]; then
              echo "l2_results=present"
            else
              echo "l2_results=missing"
            fi
          } > diagnostics/funnel-last.txt
          python - <<'PY'
          import csv
          import json
          from pathlib import Path
          path = Path(".work/l1-pending.csv")
          rows = []
          if path.exists():
              with path.open(encoding="utf-8-sig", newline="") as handle:
                  for row in csv.DictReader(handle):
                      if row.get("l1_status") == "needs_enrichment":
                          rows.append(row)
          Path("diagnostics/funnel-unresolved.json").write_text(json.dumps(rows, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          git config user.name "qrgf-market-data-bot"
          git config user.email "qrgf-market-data-bot@users.noreply.github.com"
          git add diagnostics/funnel-last.txt diagnostics/funnel-unresolved.json
          git commit -m "Record QRGF funnel failure diagnostic" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
